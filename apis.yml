name: SoLo Funds
description: >-
  SoLo Funds is a Techstars-backed, Los Angeles fintech that operates a
  community-driven peer-to-peer lending marketplace delivered as a consumer
  mobile app for iOS and Android. Members request small, short-term loans that
  other members choose to fund, with borrowers offering an optional tip and
  donation rather than mandated interest, positioning the platform as a
  member-to-member alternative to payday and overdraft borrowing. SoLo Funds
  is a consumer financial-services product and does not publish a public
  developer API, SDK, or developer portal; its only publicly reachable
  operational surface is a hosted status page.
